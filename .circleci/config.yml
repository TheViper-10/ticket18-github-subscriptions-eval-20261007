# Harmless Tony ticket-22 desktop-release FIXTURE pipeline (run4, with manual approval holds).
# NOT a real deployment. Every job only sleeps + echoes. No artifacts, no deploy, no external effect.
# Approval holds let a subscription be registered against a job while it is genuinely pending,
# so the subscribe_to_circleci_job_completed node is proven on a real pending->completion transition.
version: 2.1

jobs:
  build-product-desktop-app:
    docker:
      - image: cimg/base:2024.01
    steps:
      - run:
          name: Mock desktop build (version-bump 5.3.0)
          command: |
            echo "FIXTURE build-product-desktop-app for v5.3.0 (no real artifact)"
            sleep 120
            echo "build done"
  package-linux-qa:
    docker:
      - image: cimg/base:2024.01
    steps:
      - run:
          name: Mock linux QA package
          command: |
            echo "FIXTURE package-linux-qa"
            sleep 150
            echo "linux qa ok"
  package-windows-qa:
    docker:
      - image: cimg/base:2024.01
    steps:
      - run:
          name: Mock windows QA package
          command: |
            echo "FIXTURE package-windows-qa"
            sleep 150
            echo "windows qa ok"
  package-mac-qa:
    docker:
      - image: cimg/base:2024.01
    steps:
      - run:
          name: Mock mac QA package
          command: |
            echo "FIXTURE package-mac-qa"
            sleep 150
            echo "mac qa ok"
  package-linux-qa-fail:
    docker:
      - image: cimg/base:2024.01
    steps:
      - run:
          name: Mock linux QA package (intentional failure for S11)
          command: |
            echo "FIXTURE package-linux-qa-fail: will fail to prove a held release"
            sleep 90
            exit 1

workflows:
  # Build workflow: hold -> build. Approve the hold to start the build running.
  desktop-release-build:
    jobs:
      - hold-build:
          type: approval
      - build-product-desktop-app:
          requires: [hold-build]
  # QA workflow: hold -> 3 OS QA jobs in parallel. Approve the hold to start all three running.
  desktop-release-qa:
    jobs:
      - hold-qa:
          type: approval
      - package-linux-qa:
          requires: [hold-qa]
      - package-windows-qa:
          requires: [hold-qa]
      - package-mac-qa:
          requires: [hold-qa]
  # Failcase workflow for the partial-OS-failure variation (S11).
  desktop-release-failcase:
    jobs:
      - hold-fail:
          type: approval
      - package-linux-qa-fail:
          requires: [hold-fail]
