version: 2.1
jobs:
  work:
    docker:
      - image: cimg/base:stable
    parameters:
      seconds:
        type: integer
        default: 1
    steps:
      - run:
          name: Harmless isolated ticket28 work
          command: |
            echo "Ticket28 QA only; no release, deployment, or external side effects"
            sleep << parameters.seconds >>
            echo "Automatic work finished"
workflows:
  hotfix:
    jobs:
      - work:
          name: seed
      - work:
          name: parallel-auto
          seconds: 300
      - gate-1:
          type: approval
          requires: [seed]
      - work:
          name: after-gate-1
          seconds: 30
          requires: [gate-1]
      - gate-2:
          type: approval
          requires: [after-gate-1]
      - work:
          name: after-gate-2
          seconds: 30
          requires: [gate-2]
