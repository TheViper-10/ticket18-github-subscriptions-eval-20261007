# Ticket 22 fixture pipeline: minimal harmless desktop-release replica (2026-10-08).
# NOT a real deployment: every job only sleeps/echoes/polls a loopback helper; no artifact,
# no real publish, no external effect. CI never posts to Slack and never holds a Slack/
# DevRev/CircleCI credential of any kind. The local E2E controller watches real CircleCI job
# status with its own LOCAL CIRCLE_TOKEN and posts the [MOCK RELEASE] announcement itself
# after it observes genuine publish success; this file does not post anything.
#
# Repo:   TheViper-10/ticket18-github-subscriptions-eval-20261007 (disposable fixture only)
# Branch: mock/ticket22-cci-fixture (base branch for the PR: mock/ticket22-release-base)
# Latch branch (nonsecret, read-only from CI): mock/ticket22-fixture-signals
#
# Named jobs match the desktop-release-manager skill's expected publish-job names exactly, so
# the real external-wait workflow skill (subscribe_to_circleci_job_completed) resolves against
# a genuine CircleCI pending -> terminal transition on the actual named job:
#   desktop-app-publish-download-page-dev
#   desktop-app-publish-download-page-qa
#
# Registration latch (one line per env, no JSON registry): the dev/QA publish job holds until
# mock/ticket22-fixture-signals has a file at latch/<gate_name>.txt whose single line of text
# equals this job's own $CIRCLE_BUILD_NUM. The local controller writes that file only after it
# has confirmed the real subscription registration for this exact job number, then approves
# the matching native register-dev/register-qa Circle hold. Unauthenticated raw HTTPS read,
# bounded poll, fails closed. A fresh replacement job has a different job number, so it can
# never consume a stale latch file.
#
# Transient-fault recovery: the dev job's loopback mock-publish call genuinely returns HTTP 503
# on the first attempt and 200 on an agent-initiated rerun-from-failed of the SAME pipeline,
# using a CircleCI cache marker keyed on << pipeline.id >> (immutable: first write wins, reused
# by the rerun). No diagnosis or recovery instruction is printed anywhere in this file; the only
# runtime evidence is the real curl/HTTP transport of the loopback call.

version: 2.1

commands:
  guard-fixture-repo:
    description: Refuse to run anywhere except the disposable fixture repo.
    steps:
      - run:
          name: Guard - refuse to run outside the fixture repo
          command: |
            if [ "$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME" != "TheViper-10/ticket18-github-subscriptions-eval-20261007" ]; then
              echo "REFUSING: these fixture job names collide with real desktop-app publish jobs on purpose." >&2
              exit 1
            fi

  wait-for-registration-gate:
    description: >
      Hold the running publish job (real job number now exists) until the local fixture
      controller's plain-text latch on the public mock/ticket22-fixture-signals branch names
      THIS exact job number for << parameters.gate_name >>. Unauthenticated read, bounded poll,
      fails closed; never a silent green release.
    parameters:
      gate_name:
        type: string
    steps:
      - run:
          name: Hold until the public latch names this job number (<< parameters.gate_name >>)
          command: |
            set -eu
            URL="https://raw.githubusercontent.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/mock/ticket22-fixture-signals/latch/<< parameters.gate_name >>.txt"
            for i in $(seq 1 60); do
              BODY=$(curl -s -H 'Cache-Control: no-cache' "${URL}?cb=$(date +%s)-$i" || echo "")
              echo "  poll $i: latch='$(echo "$BODY" | tr -d '[:space:]')' want='$CIRCLE_BUILD_NUM'"
              if [ "$(echo "$BODY" | tr -d '[:space:]')" = "$CIRCLE_BUILD_NUM" ]; then
                echo "Latch matches this job number; proceeding."
                exit 0
              fi
              sleep 10
            done
            echo "Registration latch '<< parameters.gate_name >>' never matched job $CIRCLE_BUILD_NUM within the 10 min cap; failing closed." >&2
            exit 1

jobs:
  desktop-app-publish-download-page-dev:
    docker: [{ image: cimg/base:2024.01 }]
    steps:
      - checkout
      - guard-fixture-repo
      - run:
          name: Mock dev publish (ticket22 fixture, no real artifact) - start
          command: echo "FIXTURE desktop-app-publish-download-page-dev STARTED (job $CIRCLE_BUILD_NUM)."
      - wait-for-registration-gate:
          gate_name: register-dev
      - restore_cache:
          keys:
            - t22-fail-dev-once-<< pipeline.id >>
      - run:
          name: Select local mock-publish endpoint health from pipeline cache
          command: |
            set -eu
            if [ -f /tmp/t22-fail-dev-once/cleared ]; then
              echo "export PUBLISH_MOCK_STATUS=200" >> "$BASH_ENV"
            else
              mkdir -p /tmp/t22-fail-dev-once
              echo "done" > /tmp/t22-fail-dev-once/cleared
              echo "export PUBLISH_MOCK_STATUS=503" >> "$BASH_ENV"
            fi
      - save_cache:
          key: t22-fail-dev-once-<< pipeline.id >>
          paths:
            - /tmp/t22-fail-dev-once
      - run:
          name: Mock dev publish call (loopback transport; genuine HTTP status)
          command: |
            set -eu
            STATUS="${PUBLISH_MOCK_STATUS:-503}"
            PORT=8973
            SRV=/tmp/t22-mock-publish-server.py
            : > "$SRV"
            printf '%s\n' 'import sys, http.server' >> "$SRV"
            printf '%s\n' 'code = int(sys.argv[1])' >> "$SRV"
            printf '%s\n' 'port = int(sys.argv[2])' >> "$SRV"
            printf '%s\n' 'class H(http.server.BaseHTTPRequestHandler):' >> "$SRV"
            printf '%s\n' '    def do_POST(self):' >> "$SRV"
            printf '%s\n' '        body = b"{\"ok\": true}" if code == 200 else b"{\"error\": \"service unavailable\"}"' >> "$SRV"
            printf '%s\n' '        self.send_response(code)' >> "$SRV"
            printf '%s\n' '        self.send_header("Content-Type", "application/json")' >> "$SRV"
            printf '%s\n' '        self.send_header("Content-Length", str(len(body)))' >> "$SRV"
            printf '%s\n' '        self.end_headers()' >> "$SRV"
            printf '%s\n' '        self.wfile.write(body)' >> "$SRV"
            printf '%s\n' '    def log_message(self, *a):' >> "$SRV"
            printf '%s\n' '        pass' >> "$SRV"
            printf '%s\n' 'http.server.HTTPServer(("127.0.0.1", port), H).serve_forever()' >> "$SRV"
            python3 "$SRV" "$STATUS" "$PORT" &
            HELPER_PID=$!
            trap 'kill "$HELPER_PID" 2>/dev/null || true; wait "$HELPER_PID" 2>/dev/null || true' EXIT
            sleep 1
            curl -sS --fail -w 'http_status=%{http_code}\n' \
              -X POST -H 'Content-Type: application/json' \
              --data '{"artifact":"desktop-app","environment":"dev"}' \
              "http://127.0.0.1:${PORT}/publish/dev"
      - run:
          name: Mock dev publish - complete (emits the genuine completion event)
          command: echo "FIXTURE dev publish done; emitting real CircleCI completion for the subscription."

  desktop-app-publish-download-page-qa:
    docker: [{ image: cimg/base:2024.01 }]
    steps:
      - checkout
      - guard-fixture-repo
      - run:
          name: Mock QA publish (ticket22 fixture, no real artifact) - start
          command: echo "FIXTURE desktop-app-publish-download-page-qa STARTED (job $CIRCLE_BUILD_NUM)."
      - wait-for-registration-gate:
          gate_name: register-qa
      - run:
          name: Mock QA publish - complete (emits the genuine completion event)
          command: echo "FIXTURE QA publish done; emitting real CircleCI completion for the subscription."

  desktop-app-promote-prod-alpha-harmless:
    docker: [{ image: cimg/base:2024.01 }]
    steps:
      - checkout
      - guard-fixture-repo
      - run:
          name: Mock harmless final promotion (no real deploy)
          command: |
            echo "FIXTURE desktop-app-promote-prod-alpha-harmless starting"
            sleep 15
            echo "FIXTURE final mock promotion complete (NOT a real desktop release)"

workflows:
  ticket22-desktop-release:
    jobs:
      - desktop-app-publish-download-page-dev
      - register-dev:
          type: approval
      - go-QA:
          type: approval
          requires: [desktop-app-publish-download-page-dev]
      - desktop-app-publish-download-page-qa:
          requires: [go-QA]
      - register-qa:
          type: approval
          requires: [go-QA]
      - go-prod-alpha:
          type: approval
          requires: [desktop-app-publish-download-page-qa]
      - desktop-app-promote-prod-alpha-harmless:
          requires: [go-prod-alpha]
